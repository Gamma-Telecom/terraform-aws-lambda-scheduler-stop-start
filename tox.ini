[tox]
minversion = 4.0
envlist = py312,py313,py314,flake8,black,bandit,pylint,mypy
skipsdist = True

# Unit tests (py312, py313, py314)
[testenv]
skip_install = true
deps =
    boto3>=1.35
    moto[ec2,autoscaling,rds,cloudwatch,resourcegroupstaggingapi]>=5.0
    pytest>=8.0
    pytest-cov>=5.0
commands =
    pytest tests/unit --cov package

# Autoformatter
[testenv:black]
basepython = python3
skip_install = true
deps =
    black>=24.0
commands =
    black package/ --check

# Linters
[testenv:flake8]
basepython = python3
skip_install = true
deps =
    flake8>=7.0
    flake8-docstrings>=1.7
    flake8-import-order>=0.18
    pep8-naming>=0.14
commands =
    flake8 package/

[testenv:pylint]
basepython = python3
skip_install = true
deps =
    boto3>=1.35
    pylint>=3.0
commands =
    pylint package/ --rcfile=tests/sanity/.pylintrc

[testenv:bandit]
basepython = python3
skip_install = true
deps =
    bandit>=1.7
commands =
    bandit -r package/ -c tests/sanity/.bandit.yml

[testenv:mypy]
basepython = python3
skip_install = true
deps =
    mypy>=1.0
commands =
    mypy --ignore-missing-imports package/

[flake8]
ignore = D401
max-complexity = 10
max-line-length = 88
