name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: '0 18 * * sun'

jobs:
  tflint:
    name: Terraform validate ${{ matrix.terraform_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        terraform_version:
          - latest
          - 0.14.0
          - 0.13.0
    steps:
      - uses: actions/checkout@master
      - name: Terraform validate
        run: tests/sanity/terraform_tests.sh
        env:
          terraform_version: "${{ matrix.terraform_version }}"

  pythontest:
    name: ${{ matrix.config.toxenv }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - toxenv: py312
            python-version: "3.12"
          - toxenv: py313
            python-version: "3.13"
          - toxenv: py314
            python-version: "3.14"
          - toxenv: flake8
            python-version: "3.14"
          - toxenv: pylint
            python-version: "3.14"
          - toxenv: black
            python-version: "3.14"
          - toxenv: mypy
            python-version: "3.14"
          - toxenv: bandit
            python-version: "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.config.python-version }}

      - name: Install dependencies
        run: python -m pip install "tox>=4"

      - name: Python test
        run: tox
        env:
          TOXENV: "${{ matrix.config.toxenv }}"
